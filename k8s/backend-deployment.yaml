apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-backend
  namespace: agentic-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-backend
  template:
    metadata:
      labels:
        app: rag-backend
    spec:
      containers:
        - name: backend
          image: prasanna123laxmi/agentic-rag-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: rag-backend-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: rag-backend-service
  namespace: agentic-rag
spec:
  type: ClusterIP
  selector:
    app: rag-backend
  ports:
    - port: 5000
      targetPort: 5000