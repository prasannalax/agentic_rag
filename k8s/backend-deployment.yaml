
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-backend
  namespace: agentic-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-backend
  template:
    metadata:
      labels:
        app: rag-backend
    spec:
      containers:
        - name: backend
          image: mcp_powered-agentic_rag-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          envFrom:
            - secretRef:
                name: rag-backend-secrets
