apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  namespace: agentic-rag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-frontend
  template:
    metadata:
      labels:
        app: rag-frontend
    spec:
      containers:
        - name: frontend
          image: prasanna123laxmi/agentic-rag-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: rag-frontend-service
  namespace: agentic-rag
spec:
  type: NodePort
  selector:
    app: rag-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080