

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: rag-backend
    restart: always
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_CHAT_MODEL=${GROQ_CHAT_MODEL:-openai/gpt-oss-20b}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - rag-network

  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: rag-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge