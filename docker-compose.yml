
services:
  server:
    build:
      context: ./server
    container_name: agentic-rag-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  client:
    build:
      context: ./client
    container_name: agentic-rag-client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
